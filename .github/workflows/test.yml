name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: POSIX syntax
        run: find scripts tests -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r -n1 sh -n
      - name: ShellCheck
        run: find scripts tests -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r shellcheck -S error -s sh
      - name: Tests
        run: tests/run.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
