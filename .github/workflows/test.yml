name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: POSIX syntax
        run: find scripts tests -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r -n1 sh -n
      - name: ShellCheck
        run: find scripts tests -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r shellcheck -S error -s sh
      - name: Tests
        run: tests/run.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
