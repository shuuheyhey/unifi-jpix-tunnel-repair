name: Bug report
description: Report a reproducible problem without deployment secrets
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, complete addresses, prefixes, interface names, device identifiers, config, state, full diagnostics, or raw logs. Use share-safe output only.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Device model and UniFi OS or Network series only. Generalize the exact version when it is not required.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use synthetic values and list the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: discovery
    attributes:
      label: Discovery and capability checks
      description: For pre-install problems, summarize discover/check results. Review and remove deployment identifiers before sharing.
  - type: textarea
    id: diagnostics
    attributes:
      label: Share-safe diagnostics
      description: Summarize status --json, doctor and plan reason codes. Do not attach raw config or state.
  - type: textarea
    id: validation
    attributes:
      label: Validation stage
      description: State the last completed validation stage and the first failing stage. Do not paste full diagnostic or journal content.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, addresses, prefixes, MACs, interface names, serials, device IDs, config, state, and full diagnostics.
          required: true
        - label: I did not treat absence of an aggregate delegated-prefix route alone as proof of PD failure on UniFi OS 5.
          required: true
        - label: This is not a security vulnerability.
          required: true
